[package]
name = "focus-frog"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focus_frog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
active-win-pos-rs = "0.11.0"
user-idle = "0.6.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["time", "rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"

