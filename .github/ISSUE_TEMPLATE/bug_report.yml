name: Bug report
description: Report something that's broken in Focus Frog
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can — it makes reproducing the issue much faster.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I started a session with the Nuclear annoyance profile, the overlay never appeared.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, as minimal as possible.
      placeholder: |
        1. Open Focus Frog
        2. Start a session with duration 5min, profile "Nuclear"
        3. Switch to a distracting app and stay there for 4 minutes
        4. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Focus Frog version
      description: Shown in Settings, or the release tag you downloaded (e.g. v0.1.0).
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.1, Windows 11 23H2, Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Copy/paste any error output from the app or terminal. This will be auto-formatted as code, no need for backticks.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant — screenshots, whether this is a regression, etc.
