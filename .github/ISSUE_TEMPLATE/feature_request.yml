name: Feature request
description: Suggest an idea or improvement for Focus Frog
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Focus Frog is a small, deliberately focused app — see ARCHITECTURE.md for the current scope — so not every idea will fit, but it's worth writing down.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and where does the current app fall short?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, and why you preferred this one.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, related issues, links, anything else useful.
